# Values come from .env next to this file (not in git): the Supabase ones are
# needed at build time, PEXELS_API_KEY at runtime.
services:
  puzzelin:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    env_file: .env
    networks: [edge]

networks:
  edge:
    external: true
