# PEXELS_API_KEY comes from .env next to this file (not in git). Caddy (edge) sends
# puzzelin.se here; the SQLite database and uploaded images live in /srv/data/puzzelin.
services:
  puzzelin:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - /srv/data/puzzelin:/data
    networks: [edge]

networks:
  edge:
    external: true
